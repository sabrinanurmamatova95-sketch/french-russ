<header><h1>Mes cartes de français 🇫🇷</h1><div class="sub">Твой словарь и карточки по темам</div></header>
<main>
<section class="panel">
  <b>Добавить слово</b>

  <input id="fr" placeholder="Например: robe или chaussures" autocomplete="off">
  <div class="actions">

    <div><label>Перевод</label><input id="ru" placeholder="Русский перевод"></div>
    <div><label>Как читается</label><input id="reading" placeholder="Например: [ля роб]"></div>
    <div><label>Тема</label><input id="topic" list="topics" placeholder="Одежда"><datalist id="topics"></datalist></div>
    <div><label>&nbsp;</label><button class="primary" id="addBtn" style="width:100%">＋ Добавить карточку</button></div>

  <div id="msg"></div>
</section>

<section class="panel">
 <div class="row">
  <div><label>Тема для повторения</label><select id="filter"></select></div>
  <div><label>Направление</label><select id="direction"><option value="fr-ru">FR → RU</option><option value="ru-fr">RU → FR</option></select></div>
 </div>
 <div class="actions"><button id="shuffle">🔀 Новая карточка</button><button id="hardOnly">⭐ Только сложные</button></div>
</section>

<section class="panel">

  <div id="answer" class="hidden"><div id="back" class="meaning"></div><div id="backReading" class="reading"></div></div>
 </div>
 <div class="actions">

 </div>
 <div id="stats" class="stats"></div>
</section>

function stripArticle(s){return s.trim().replace(/^(le|la|les|l['’])\s*/i,"").trim();}
function hasArticle(s){return /^(le|la|les)\s+|^l['’]/i.test(s.trim());}
function normalizeArticle(){
 let el=$("fr"), raw=el.value.trim(); if(!raw)return;
 if(hasArticle(raw)){status("Артикль уже указан ✓","good"); return;}
 let key=stripArticle(raw).toLowerCase(), a=LEXICON[key];
 if(a){ el.value=(a==="l’"?a+raw:a+" "+raw); status("Артикль добавлен: "+a+" ✓","good"); }
 else status("Я не буду угадывать род этого слова. Проверь его в словаре или через ChatGPT, затем добавь le / la / l’ / les.","bad");
}
function status(t,c=""){ $("articleStatus").textContent=t; $("articleStatus").className="status "+c; }
function refresh(){
 let topics=[...new Set(cards.map(c=>c.topic).filter(Boolean))].sort();
 $("topics").innerHTML=topics.map(t=>`<option value="${esc(t)}">`).join("");
 let old=$("filter").value; $("filter").innerHTML='<option value="">Все темы</option>'+topics.map(t=>`<option>${esc(t)}</option>`).join(""); $("filter").value=old;
 $("stats").textContent=`Карточек: ${cards.length} · сложных: ${cards.filter(c=>(c.missed||0)>(c.known||0)).length}`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function pool(){let a=cards.filter(c=>!$("filter").value||c.topic===$("filter").value);if(hard)a=a.filter(c=>(c.missed||0)>(c.known||0));return a;}
function next(){
 let a=pool(); if(!a.length){$("front").textContent="Нет карточек для этого фильтра";current=null;return;}
 let weighted=[]; a.forEach(c=>{let w=1+Math.max(0,(c.missed||0)-(c.known||0));for(let i=0;i<Math.min(w,6);i++)weighted.push(c)});
 current=weighted[Math.floor(Math.random()*weighted.length)]; render();
}
function render(){
 let d=$("direction").value, frFirst=d==="fr-ru";
 $("front").textContent=frFirst?current.fr:current.ru;
 $("frontReading").textContent=frFirst?current.reading:"";
 $("back").textContent=frFirst?current.ru:current.fr;
 $("backReading").textContent=frFirst?"":current.reading;
 $("answer").classList.add("hidden");
}
function speak(text){if(!("speechSynthesis" in window))return alert("На этом устройстве озвучивание недоступно.");let u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";speechSynthesis.cancel();speechSynthesis.speak(u);}

 }catch(e){status("Автоперевод сейчас недоступен. Можно нажать «Спросить ChatGPT».","bad")}

if(importBtn) importBtn.addEventListener("click",()=>importFile.click());
if(importFile) importFile.addEventListener("change",async()=>{
  const f=importFile.files&&importFile.files[0]; if(!f) return;
  try{
    const parsed=JSON.parse(await f.text());
    const incoming=Array.isArray(parsed)?parsed:(Array.isArray(parsed.cards)?parsed.cards:[]);
    if(!incoming.length) throw new Error("Нет карточек");
    const keys=new Set(cards.map(c=>String(c.fr||"").trim().toLocaleLowerCase("fr")));
    let added=0;
    for(const c of incoming){
      if(!c || !String(c.fr||"").trim()) continue;
      const key=String(c.fr).trim().toLocaleLowerCase("fr");
      if(keys.has(key)) continue;
      cards.push({
        fr:String(c.fr).trim(), ru:String(c.ru||"").trim(),
        reading:String(c.reading||c.pronunciation||"").trim(),
        topic:String(c.topic||"Другое").trim(),
        known:Number(c.known||0), missed:Number(c.missed||0)
      });
      keys.add(key); added++;
    }
    localStorage.setItem("frcards_v3",JSON.stringify(cards));
    if(typeof fillTopics==="function") fillTopics();
    else if(typeof render==="function") render();
    alert("Добавлено новых карточек: "+added);
  }catch(e){ alert("Не удалось импортировать файл. Нужен JSON со списком карточек."); }
  importFile.value="";
});
</script>
</body></html>
